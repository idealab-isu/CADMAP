[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "cadmap"
dynamic = ["version"]
description = "Deforms a CAD model to a pre-segmented point cloud while preserving CAD topology and water-tight properties"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "src/cadmap/_vendor/nurbsdiff/LICENSE"]
dependencies = [
    "EigenFit>=0.2.0,<0.3",  # paired MeshMap release
    "numpy>=1.21",
    "torch>=1.12",
    "geomdl>=5.3",
    "open3d>=0.16",
    "matplotlib>=3.5",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "tqdm>=4.64",
    "h5py>=3",
    "einops>=0.6",  # vendored NURBSDiff (cadmap._vendor.nurbsdiff)
]

# NOTE: pythonocc-core is not on PyPI -> conda install -c conda-forge pythonocc-core
# EigenFit and limatix are not on PyPI either; install them from the local
# MeshMap/ and limatix/ sources (see INSTALL.md).

[project.urls]
Repository = "https://github.com/idealab-isu/CADMAP"
Releases = "https://github.com/idealab-isu/CADMAP/releases"

[tool.hatch.version]
path = "src/cadmap/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/INSTALL.md", "/CHANGELOG.md", "/RELEASING.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/cadmap"]

[project.entry-points."limatix.processtrak.step_url_search_path"]
"cadmap.pt_steps" = "cadmap.pt_steps:getstepurlpath"
