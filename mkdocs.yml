site_name: CADMap
site_description: Topology-preserving NURBS deformation of CAD models to point clouds
site_author: Jerry Liu
repo_url: https://github.com/yourusername/cadmap

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Installation: installation.md
  - API Reference:
    - Geometry: api/geometry.md
    - Conversion: api/conversion.md
    - Sampling: api/sampling.md
    - Deformation: api/deformation.md
    - Registration: api/registration.md
    - Metrics: api/metrics.md
    - Visualization: api/visualization.md
